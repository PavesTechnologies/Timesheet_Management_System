spring.application.name=TimeSheetManagement

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.main.allow-bean-definition-overriding=false
logging.level.org.springframework=DEBUG
server.port=${SERVER_PORT}

# Mail provider: gmail = SMTP, azure = Microsoft Graph
email.service=${EMAIL_SERVICE:gmail}

# SMTP (used when email.service=gmail)
spring.mail.host=${EMAIL_HOST:}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Microsoft Graph (used when email.service=azure)
azure.tenant-id=${AZURE_TENANT_ID:}
azure.client-id=${AZURE_CLIENT_ID:}
azure.client-secret=${AZURE_CLIENT_SECRET:}
azure.graph.sender=${GRAPH_SENDER_ADDRESS:}
azure.login.base-url=https://login.microsoftonline.com
azure.graph.base-url=https://graph.microsoft.com/v1.0


timesheet.user=${timesheetuser}
timesheet.password=${timesheetpassword}

timesheet.expectedBaseHours=176
leave.daily.hours=8

pms.api.base-url=${PMS_API_BASE_URL}
eos.api.base-url=${EOS_API_BASE_URL}
ums.api.base-url=${UMS_API_BASE_URL}
lms.api.base-url=${LMS_API_BASE_URL}
tms.api.base-url=${TMS_API_BASE_URL}
app.frontend.url=${APP_FRONTEND_URL}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# openid issuer url
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ISSUER_URL}

server.max-http-request-header-size=128KB

server.servlet.context-path=/tms